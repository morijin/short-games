<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🏰 Tower Defense</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Courier New',monospace; color:#fff; user-select:none; }
#wrapper { display:flex; gap:16px; align-items:flex-start; }
#sidebar {
  width:140px; background:#0f0f1f; border:1px solid #333;
  border-radius:8px; padding:12px 8px; display:flex; flex-direction:column; gap:8px;
}
#sidebar h3 { text-align:center; font-size:13px; color:#adf; letter-spacing:1px; margin-bottom:4px; }
.tower-btn {
  background:#1a1a3a; border:1px solid #444; border-radius:6px;
  padding:8px 6px; cursor:pointer; transition:all .15s; text-align:center; font-size:11px;
}
.tower-btn:hover { border-color:#7df; background:#222250; }
.tower-btn.selected { border-color:#ffd700; background:#2a2a10; }
.tower-btn .icon { font-size:22px; display:block; }
.tower-btn .name { color:#ccc; margin:2px 0; }
.tower-btn .cost { color:#ffd700; }
.tower-btn .desc { color:#888; font-size:10px; margin-top:2px; }
#topbar { display:flex; gap:24px; margin-bottom:10px; font-size:14px; letter-spacing:1px; }
#topbar span { color:#ffd700; }
canvas { border:1px solid #333; cursor:crosshair; display:block; }
#msg-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.7);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:32px; font-weight:bold; color:#fff; text-shadow:0 0 20px #4af;
  z-index:10;
}
#msg-overlay .sub { font-size:15px; color:#adf; margin-top:10px; letter-spacing:1px; }
#msg-overlay button {
  margin-top:20px; padding:10px 32px; font-size:16px; background:#1a3a5a;
  border:1px solid #4af; color:#fff; border-radius:6px; cursor:pointer; font-family:inherit;
}
#msg-overlay button:hover { background:#2a5a7a; }
#wave-announce {
  position:absolute; pointer-events:none;
  font-size:28px; font-weight:bold; color:#fff;
  text-shadow:0 0 16px #f84; opacity:0; transition:opacity .3s;
  top:50%; left:50%; transform:translate(-50%,-50%);
}
#sell-hint { font-size:11px; color:#666; text-align:center; margin-top:4px; }
</style>
</head>
<body>

<div id="topbar">
  <div>💰 <span id="gold">150</span></div>
  <div>❤️ <span id="hp">20</span></div>
  <div>🌊 웨이브 <span id="wave">0</span></div>
  <div>점수 <span id="score">0</span></div>
</div>

<div id="wrapper">
  <div id="sidebar">
    <h3>타워 선택</h3>
    <div class="tower-btn selected" data-type="arrow" onclick="selectTower('arrow')">
      <span class="icon">🏹</span>
      <div class="name">화살 타워</div>
      <div class="cost">50G</div>
      <div class="desc">빠름, 단일 타겟</div>
    </div>
    <div class="tower-btn" data-type="cannon" onclick="selectTower('cannon')">
      <span class="icon">💣</span>
      <div class="name">대포 타워</div>
      <div class="cost">100G</div>
      <div class="desc">느림, 범위 폭발</div>
    </div>
    <div class="tower-btn" data-type="ice" onclick="selectTower('ice')">
      <span class="icon">❄️</span>
      <div class="name">얼음 타워</div>
      <div class="cost">80G</div>
      <div class="desc">적 속도 감소</div>
    </div>
    <div class="tower-btn" data-type="laser" onclick="selectTower('laser')">
      <span class="icon">⚡</span>
      <div class="name">레이저 타워</div>
      <div class="cost">120G</div>
      <div class="desc">연사, 고데미지</div>
    </div>
    <hr style="border-color:#333">
    <div id="sell-hint">설치된 타워 클릭 시 판매 (설치금의 60%)</div>
    <div id="next-wave-btn" onclick="startWave()" style="background:#1a3a1a;border:1px solid #4a4;border-radius:6px;padding:8px;text-align:center;cursor:pointer;font-size:12px;color:#8f8;margin-top:4px;">
      ▶ 다음 웨이브
    </div>
  </div>

  <div style="position:relative">
    <canvas id="c"></canvas>
    <div id="wave-announce"></div>
  </div>
</div>

<div id="msg-overlay">
  🏰 Tower Defense
  <div class="sub">타워를 설치하고 적을 막아라!</div>
  <div class="sub" style="font-size:12px;margin-top:6px;color:#888;">캔버스 클릭으로 타워 설치 | 설치된 타워 클릭으로 판매</div>
  <button onclick="startGame()">게임 시작</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Grid
const COLS = 22, ROWS = 16, CS = 36;
canvas.width = COLS * CS;
canvas.height = ROWS * CS;

// Path (column, row) 형태
const PATH = [
  [0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[6,3],[6,4],[6,5],[6,6],
  [7,6],[8,6],[9,6],[10,6],[11,6],[12,6],[12,5],[12,4],[12,3],[12,2],
  [13,2],[14,2],[15,2],[16,2],[16,3],[16,4],[16,5],[16,6],[16,7],[16,8],
  [15,8],[14,8],[13,8],[12,8],[11,8],[10,8],[10,9],[10,10],[10,11],[10,12],
  [11,12],[12,12],[13,12],[14,12],[15,12],[16,12],[17,12],[18,12],[19,12],[20,12],[21,12]
];
const pathSet = new Set(PATH.map(([c,r]) => `${c},${r}`));

// World pos from grid
function gx(c) { return c * CS + CS/2; }
function gy(r) { return r * CS + CS/2; }

// Waypoints for enemies (pixel centers)
const WAYPOINTS = PATH.map(([c,r]) => ({x: gx(c), y: gy(r)}));

// State
let gold, hp, score, waveNum, waveActive, waveClear;
let towers = [], enemies = [], projectiles = [], particles = [];
let selectedType = 'arrow';
let grid = {}; // "c,r" -> tower index

const TOWER_DEF = {
  arrow:  { cost:50,  range:90,  damage:15,  rate:40,  color:'#8f8', emoji:'🏹', splashR:0,   slow:0    },
  cannon: { cost:100, range:100, damage:60,  rate:90,  color:'#f84', emoji:'💣', splashR:36,  slow:0    },
  ice:    { cost:80,  range:85,  damage:8,   rate:50,  color:'#4df', emoji:'❄️', splashR:0,   slow:0.45 },
  laser:  { cost:120, range:95,  damage:25,  rate:18,  color:'#ff0', emoji:'⚡', splashR:0,   slow:0    },
};

const ENEMY_TYPES = [
  { name:'기본',  hp:60,  speed:1.0, reward:10, color:'#f44', r:10, armor:0   },
  { name:'빠른',  hp:40,  speed:1.8, reward:15, color:'#f84', r:8,  armor:0   },
  { name:'탱크',  hp:300, speed:0.5, reward:30, color:'#a4f', r:14, armor:0.3 },
  { name:'보스',  hp:800, speed:0.7, reward:80, color:'#f0f', r:18, armor:0.4 },
];

function waveEnemyList(w) {
  const list = [];
  const count = 8 + w * 3;
  for (let i = 0; i < count; i++) {
    let typeIdx = 0;
    const r = Math.random();
    if (w >= 8 && r < 0.08) typeIdx = 3;      // 보스
    else if (w >= 4 && r < 0.2) typeIdx = 2;  // 탱크
    else if (w >= 2 && r < 0.35) typeIdx = 1; // 빠른
    list.push({...ENEMY_TYPES[typeIdx]});
  }
  // 웨이브 5, 10마다 보스 추가
  if (w % 5 === 0 && w > 0) list.push({...ENEMY_TYPES[3]});
  return list;
}

let spawnQueue = [], spawnTimer = 0;

function startGame() {
  gold = 150; hp = 20; score = 0; waveNum = 0;
  waveActive = false; waveClear = true;
  towers = []; enemies = []; projectiles = []; particles = [];
  grid = {};
  document.getElementById('msg-overlay').style.display = 'none';
  updateUI();
}

function updateUI() {
  document.getElementById('gold').textContent = gold;
  document.getElementById('hp').textContent = hp;
  document.getElementById('wave').textContent = waveNum;
  document.getElementById('score').textContent = score;
}

function selectTower(type) {
  selectedType = type;
  document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector(`[data-type="${type}"]`).classList.add('selected');
}

function startWave() {
  if (waveActive) return;
  waveNum++;
  waveActive = true;
  waveClear = false;
  spawnQueue = waveEnemyList(waveNum);
  spawnTimer = 0;
  updateUI();
  announceWave(`웨이브 ${waveNum}`);
}

function announceWave(text) {
  const el = document.getElementById('wave-announce');
  el.textContent = text;
  el.style.opacity = 1;
  setTimeout(() => el.style.opacity = 0, 1800);
}

// Canvas click
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const col = Math.floor(mx / CS), row = Math.floor(my / CS);
  const key = `${col},${row}`;

  // 판매
  if (grid[key] !== undefined) {
    const t = towers[grid[key]];
    const refund = Math.floor(TOWER_DEF[t.type].cost * 0.6);
    gold += refund;
    towers.splice(grid[key], 1);
    // grid 재구축
    grid = {};
    towers.forEach((t,i) => { grid[`${t.col},${t.row}`] = i; });
    updateUI();
    return;
  }

  // 경로 위엔 설치 불가
  if (pathSet.has(key)) return;
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

  const def = TOWER_DEF[selectedType];
  if (gold < def.cost) { flashGold(); return; }

  gold -= def.cost;
  const idx = towers.length;
  towers.push({ type:selectedType, col, row, x:gx(col), y:gy(row), cooldown:0, ...def });
  grid[key] = idx;
  updateUI();
});

function flashGold() {
  const el = document.getElementById('gold');
  el.style.color = '#f44';
  setTimeout(() => el.style.color = '#ffd700', 400);
}

// Spawn
function spawnEnemy(def) {
  const base = {...def};
  base.maxHp = base.hp;
  base.wp = 0; // waypoint index
  base.x = WAYPOINTS[0].x;
  base.y = WAYPOINTS[0].y;
  base.slow = 0;
  enemies.push(base);
}

// Update
function update() {
  // Spawn
  if (waveActive && spawnQueue.length > 0) {
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnEnemy(spawnQueue.shift());
      spawnTimer = 45;
    }
  }

  // Enemies move
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.slow > 0) e.slow--;
    const spd = e.slow > 0 ? e.speed * 0.4 : e.speed;
    if (e.wp >= WAYPOINTS.length - 1) {
      // 목표 도달
      hp -= 1;
      if (e.name === '탱크' || e.name === '보스') hp -= 1;
      enemies.splice(i, 1);
      updateUI();
      if (hp <= 0) { gameOver(); return; }
      continue;
    }
    const target = WAYPOINTS[e.wp + 1];
    const dx = target.x - e.x, dy = target.y - e.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < spd + 1) { e.wp++; e.x = target.x; e.y = target.y; }
    else { e.x += dx/dist * spd; e.y += dy/dist * spd; }
  }

  // Wave clear check
  if (waveActive && spawnQueue.length === 0 && enemies.length === 0 && !waveClear) {
    waveClear = true;
    waveActive = false;
    const bonus = waveNum * 15;
    gold += bonus;
    updateUI();
    announceWave(`웨이브 ${waveNum} 클리어! +${bonus}G`);
  }

  // Towers shoot
  towers.forEach(t => {
    if (t.cooldown > 0) { t.cooldown--; return; }
    // find target (first enemy closest to end)
    let best = null, bestWp = -1;
    enemies.forEach(e => {
      const dx = e.x - t.x, dy = e.y - t.y;
      if (dx*dx + dy*dy <= t.range*t.range) {
        if (e.wp > bestWp) { bestWp = e.wp; best = e; }
      }
    });
    if (!best) return;
    t.cooldown = t.rate;
    projectiles.push({
      x: t.x, y: t.y,
      tx: best.x, ty: best.y,
      target: best,
      type: t.type,
      damage: t.damage,
      splashR: t.splashR,
      slow: t.slow,
      speed: t.type === 'laser' ? 999 : t.type === 'arrow' ? 7 : 5,
      color: t.color,
    });
  });

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (p.speed >= 999) {
      // instant hit
      hitEnemy(p, p.target);
      projectiles.splice(i, 1);
      continue;
    }
    // update target pos
    if (p.target && p.target.hp > 0) { p.tx = p.target.x; p.ty = p.target.y; }
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < p.speed + 2) {
      if (p.splashR > 0) {
        // splash
        explode(p.tx, p.ty, p.color, 14);
        enemies.forEach(e => {
          const ex = e.x - p.tx, ey = e.y - p.ty;
          if (ex*ex + ey*ey <= p.splashR*p.splashR) hitEnemy(p, e);
        });
      } else {
        hitEnemy(p, p.target);
      }
      projectiles.splice(i, 1);
    } else {
      p.x += dx/dist * p.speed;
      p.y += dy/dist * p.speed;
    }
  }

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.93; p.vy *= 0.93; p.life -= p.decay; });
  particles = particles.filter(p => p.life > 0);
}

function hitEnemy(proj, enemy) {
  if (!enemy || enemy.hp <= 0) return;
  const dmg = proj.damage * (1 - (enemy.armor || 0));
  enemy.hp -= dmg;
  if (proj.slow) enemy.slow = 80;
  if (enemy.hp <= 0) {
    score += enemy.reward * waveNum;
    gold += enemy.reward;
    updateUI();
    explode(enemy.x, enemy.y, enemy.color, 16);
    const idx = enemies.indexOf(enemy);
    if (idx !== -1) enemies.splice(idx, 1);
  }
}

function explode(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 3 + 1;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life:1, decay:0.04+Math.random()*0.03, r:Math.random()*3+1, color });
  }
}

function gameOver() {
  const o = document.getElementById('msg-overlay');
  o.innerHTML = `💀 게임 오버<div class="sub">웨이브 ${waveNum} · 점수 ${score}</div><button onclick="startGame()">다시 시작</button>`;
  o.style.display = 'flex';
}

// Draw
function drawPath() {
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = CS - 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  WAYPOINTS.forEach((w, i) => i === 0 ? ctx.moveTo(w.x, w.y) : ctx.lineTo(w.x, w.y));
  ctx.stroke();
  // 밝은 도로
  ctx.strokeStyle = '#4a3a2a';
  ctx.lineWidth = CS - 10;
  ctx.beginPath();
  WAYPOINTS.forEach((w, i) => i === 0 ? ctx.moveTo(w.x, w.y) : ctx.lineTo(w.x, w.y));
  ctx.stroke();
}

function drawGrid() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!pathSet.has(`${c},${r}`)) {
        ctx.fillStyle = (c + r) % 2 === 0 ? '#142214' : '#1a2a1a';
        ctx.fillRect(c*CS, r*CS, CS, CS);
      }
    }
  }
}

// Hover preview
let hoverCell = null;
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const col = Math.floor((e.clientX - rect.left) / CS);
  const row = Math.floor((e.clientY - rect.top) / CS);
  hoverCell = {col, row};
});
canvas.addEventListener('mouseleave', () => hoverCell = null);

function drawHover() {
  if (!hoverCell) return;
  const {col, row} = hoverCell;
  const key = `${col},${row}`;
  if (pathSet.has(key)) return;

  // 설치된 타워면 판매 미리보기
  if (grid[key] !== undefined) {
    const t = towers[grid[key]];
    ctx.fillStyle = 'rgba(255,80,80,0.15)';
    ctx.fillRect(col*CS, row*CS, CS, CS);
    ctx.strokeStyle = '#f44';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(col*CS+1, row*CS+1, CS-2, CS-2);
    // range
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.range, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,80,80,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    return;
  }

  const def = TOWER_DEF[selectedType];
  const canAfford = gold >= def.cost;
  ctx.fillStyle = canAfford ? 'rgba(100,200,100,0.15)' : 'rgba(200,50,50,0.1)';
  ctx.fillRect(col*CS, row*CS, CS, CS);
  ctx.strokeStyle = canAfford ? '#4f4' : '#f44';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(col*CS+1, row*CS+1, CS-2, CS-2);
  // range preview
  ctx.beginPath();
  ctx.arc(gx(col), gy(row), def.range, 0, Math.PI*2);
  ctx.strokeStyle = canAfford ? 'rgba(100,200,100,0.3)' : 'rgba(200,50,50,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawTowers() {
  towers.forEach(t => {
    ctx.fillStyle = '#1a2a1a';
    ctx.fillRect(t.col*CS+2, t.row*CS+2, CS-4, CS-4);
    // 색상 테두리
    ctx.strokeStyle = t.color;
    ctx.lineWidth = 2;
    ctx.strokeRect(t.col*CS+3, t.row*CS+3, CS-6, CS-6);
    ctx.font = `${CS*0.6}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.emoji, t.x, t.y);
  });
}

function drawEnemies() {
  enemies.forEach(e => {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(e.x, e.y+e.r+2, e.r*0.8, 4, 0, 0, Math.PI*2);
    ctx.fill();
    // Body
    const grad = ctx.createRadialGradient(e.x-e.r/3, e.y-e.r/3, 1, e.x, e.y, e.r);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.3, e.color);
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
    ctx.fill();
    // Slow overlay
    if (e.slow > 0) {
      ctx.fillStyle = 'rgba(100,200,255,0.35)';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
      ctx.fill();
    }
    // HP bar
    const bw = e.r * 2.2;
    ctx.fillStyle = '#300';
    ctx.fillRect(e.x - bw/2, e.y - e.r - 7, bw, 4);
    ctx.fillStyle = e.hp/e.maxHp > 0.5 ? '#4f4' : e.hp/e.maxHp > 0.25 ? '#ff4' : '#f44';
    ctx.fillRect(e.x - bw/2, e.y - e.r - 7, bw * Math.max(0, e.hp/e.maxHp), 4);
  });
}

function drawProjectiles() {
  projectiles.forEach(p => {
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    if (p.type === 'cannon') ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
    else if (p.type === 'ice') ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
    else ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawStartEnd() {
  // Start
  ctx.fillStyle = '#2f2';
  ctx.font = 'bold 12px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('START', WAYPOINTS[0].x, WAYPOINTS[0].y - 16);
  // End
  ctx.fillStyle = '#f44';
  const last = WAYPOINTS[WAYPOINTS.length-1];
  ctx.fillText('GOAL', last.x, last.y - 16);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  drawPath();
  drawStartEnd();
  drawHover();
  drawTowers();
  drawEnemies();
  drawProjectiles();
  drawParticles();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
