<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>짧은게임</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #000; }
      main { max-width: 560px; padding: 48px 24px; text-align: center; }
      h1 { margin: 0; font-size: 36px; line-height: 1.1; font-weight: 500; letter-spacing: 0; }
      p { margin: 20px 0 0; color: #737373; line-height: 1.6; }
      code { display: inline-flex; margin-top: 28px; border-radius: 9999px; background: #fafafa; padding: 12px 20px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>짧은게임</h1>
      <p>Simple HTML Publisher가 만든 첫 GitHub Pages 배포입니다.</p>
      <code>gh-pages / index.html</code>
    </main>
  </body>
</html>
